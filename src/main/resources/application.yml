server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

xiaomi:
  enabled: true
  api:
    base-url: https://account.xiaomi.com
    io-url: https://api.io.mi.com/app
    na-url: https://api.ai.mi.com
    na-url2: https://api2.mina.mi.com
  crypto:
    # AES-256 密钥，必须恰好 32 字节（ASCII 字符），建议随机生成
    # 示例生成命令: head -c 32 /dev/urandom | base64 | head -c 32
    # 未配置时敏感字段将明文存储（仅限开发环境）
    aes-key: ${XIAOMI_AES_KEY:}
  http:
    connect-timeout: 10000
    read-timeout: 30000
    max-retries: 3
  folder:
    # 音频文件夹根路径，Docker 部署时通过 -e MUSIC_PATH=/music 指定
    path: ${MUSIC_PATH:}
    # 文件监控开关，开启后定时扫描文件夹变化
    watch-enabled: ${FOLDER_WATCH_ENABLED:false}
    # 监控间隔（秒）
    watch-interval: ${FOLDER_WATCH_INTERVAL:10}
    # 忽略的目录名，多个用逗号分隔
    ignore-dirs: ${FOLDER_IGNORE_DIRS:tmp,cache}
    # 目录扫描深度
    max-depth: ${FOLDER_MAX_DEPTH:10}
  voice:
    # 对话轮询间隔（秒）
    poll-interval: ${VOICE_POLL_INTERVAL:1}
    # 命令日志保留天数
    history-retention-days: ${VOICE_HISTORY_RETENTION:7}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:xiaomi_play}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false

mybatis-flex:
  logger:
    enabled: false

